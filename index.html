<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        
        <!-- Budget Section -->
        <div class="budget-section">
            <label for="budget">Monthly Budget (₹):</label>
            <input type="number" id="budget" placeholder="Enter budget" min="0" step="0.01">
            <button id="set-budget">Set Budget</button>
            <p id="budget-display">Current Budget: ₹0.00</p>
            <p id="budget-notification" class="notification hidden">Warning: You've used 50% or more of your budget!</p>
        </div>
        
        <!-- Add Expense Form -->
        <div class="add-expense">
            <h2>Add Expense</h2>
            <input type="text" id="title" placeholder="Expense Title" required>
            <input type="number" id="amount" placeholder="Amount (₹)" min="0" step="0.01" required>
            <select id="category" required>
                <option value="">Select Category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
            </select>
            <input type="date" id="date" required>
            <button id="add-expense">Add Expense</button>
        </div>
        
        <!-- Filter Section -->
        <div class="filter-section">
            <h2>Filter Expenses</h2>
            <select id="filter-category">
                <option value="">All Categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
                <option value="Other">Other</option>
            </select>
            <input type="date" id="filter-date" placeholder="Filter from date">
            <button id="apply-filter">Apply Filter</button>
        </div>
        
        <!-- Total Expenses -->
        <div class="total-section">
            <h2>Total Expenses: ₹<span id="total">0.00</span></h2>
        </div>
        
        <!-- Expense List -->
        <div class="expense-list">
            <h2>Expenses</h2>
            <ul id="expenses"></ul>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
